<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工註冊 - 報工系統</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>員工註冊</h1>
      <p class="subtitle">建立您的報工系統帳號</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="empId">工號</label>
          <input type="text" id="empId" placeholder="請輸入工號" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="name">姓名</label>
          <input type="text" id="name" placeholder="請輸入姓名" required>
        </div>
        <div class="form-group">
          <label for="group">組別</label>
          <select id="group" required>
            <option value="">載入中...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">密碼</label>
          <input type="password" id="password" placeholder="請設定密碼（至少 6 個字元）" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirm">確認密碼</label>
          <input type="password" id="confirm" placeholder="請再次輸入密碼" required autocomplete="new-password">
        </div>
        <div id="registerMsg" class="msg hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">建立帳號</button>
      </form>

      <div class="auth-footer">
        已有帳號？<a href="index.html">返回登入</a>
      </div>
    </div>
  </div>

  <script src="js/api.js?v=20260423-2"></script>
  <script>
    function normalizeNumericInputValue(value) {
      return String(value || '').trim().replace(/^_(?=\d+$)/, '');
    }

    const empIdInput = document.getElementById('empId');
    empIdInput.addEventListener('blur', () => {
      empIdInput.value = normalizeNumericInputValue(empIdInput.value);
    });

    async function loadGroups() {
      const groupSel = document.getElementById('group');
      try {
        const r = await callAPI({ action: 'getGroups' });
        const groups = r.status === 'success' ? (r.groups || []) : [];
        groupSel.innerHTML = '<option value="">請選擇組別</option>';
        groups.forEach(group => groupSel.appendChild(new Option(group, group)));
        if (!groups.length) {
          groupSel.innerHTML = '<option value="">尚無可選組別</option>';
          groupSel.disabled = true;
          document.getElementById('submitBtn').disabled = true;
          const msgEl = document.getElementById('registerMsg');
          msgEl.className = 'msg msg-error';
          msgEl.textContent = '尚未建立組別，請先由主管匯入組別清單';
        }
      } catch (err) {
        groupSel.innerHTML = '<option value="">組別載入失敗</option>';
        groupSel.disabled = true;
        document.getElementById('submitBtn').disabled = true;
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('submitBtn');
      const msgEl = document.getElementById('registerMsg');
      const pwd   = document.getElementById('password').value;

      if (pwd !== document.getElementById('confirm').value) {
        msgEl.className   = 'msg msg-error';
        msgEl.textContent = '兩次密碼輸入不一致';
        return;
      }

      btn.disabled    = true;
      btn.textContent = '處理中...';
      msgEl.className = 'msg hidden';

      try {
        const id    = normalizeNumericInputValue(document.getElementById('empId').value);
        document.getElementById('empId').value = id;
        const name  = document.getElementById('name').value.trim();
        const group = document.getElementById('group').value.trim();
        const hash  = await hashPassword(pwd);
        const r     = await callAPI({ action: 'register', id, name, group, pwd: hash });

        if (r.status === 'success') {
          msgEl.className   = 'msg msg-success';
          msgEl.textContent = r.message + '  3 秒後跳轉至登入頁...';
          setTimeout(() => { window.location.href = 'index.html'; }, 3000);
        } else {
          msgEl.className   = 'msg msg-error';
          msgEl.textContent = r.message;
        }
      } catch (err) {
        msgEl.className   = 'msg msg-error';
        msgEl.textContent = err.message || '連線失敗，請稍後再試';
      } finally {
        btn.disabled    = false;
        btn.textContent = '建立帳號';
      }
    });

    window.addEventListener('DOMContentLoaded', loadGroups);
  </script>
</body>
</html>
